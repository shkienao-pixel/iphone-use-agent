="269.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">视觉执行器</text><text x="125.33333333333333" y="296.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">AgentEngine + Harness</text><polyline points="125.33333333333333,322 125.33333333333333,370" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#lanes-gray)"  /><rect x="16" y="370" width="218.66666666666666" height="88" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="125.33333333333333" y="396.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">画面与输入适配</text><text x="125.33333333333333" y="423.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">Capture / OCR</text><text x="125.33333333333333" y="441.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">MouseExecutor</text><polyline points="125.33333333333333,458 125.33333333333333,506" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#lanes-gray)"  /><rect x="16" y="506" width="218.66666666666666" height="88" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="125.33333333333333" y="541.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">配件与系统输入</text><text x="125.33333333333333" y="568.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">BLE → ESP32 → iOS HID</text><rect x="250.66666666666663" y="20" width="234.66666666666666" height="610" rx="10" fill="none" stroke="#657281" stroke-width="1.2" stroke-dasharray="6 5"/><text x="264.66666666666663" y="44" text-anchor="start" font-size="12" font-weight="500" fill="#17212b">原生任务通道</text><text x="367.99999999999994" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">最多 3 项；同资源互斥</text><rect x="258.66666666666663" y="98" width="218.66666666666666" height="88" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="367.99999999999994" y="133.5" text-anchor="middle" font-size="14"