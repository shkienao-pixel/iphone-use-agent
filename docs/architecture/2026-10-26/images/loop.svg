<svg xmlns="http://www.w3.org/2000/svg" width="736" height="926" viewBox="0 0 736 926" role="img" aria-label="GUI 单轮闭环：取屏、解释、决策、复核、执行与结果取证；未完成才进入下一轮" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title>GUI 单轮闭环：取屏、解释、决策、复核、执行与结果取证；未完成才进入下一轮</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="loop-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#657281"/></marker><marker id="loop-gray-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M7 1 L1 4 L7 7Z" fill="#657281"/></marker><marker id="loop-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#286ca8"/></marker><marker id="loop-blue-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M7 1 L1 4 L7 7Z" fill="#286ca8"/></marker></defs><text x="70" y="73" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">01</text><rect x="100" y="20" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="50.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">获取当前画面</text><text x="409" y="77.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">CaptureService / FrameReadiness</text><text x="409" y="95.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">系统确认时间与输入边界</text><polyline points="409,116 409,166" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#loop-gray)"  /><text x="70" y="219" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">02</text><rect x="100" y="166" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="196.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">本地解释与上下文</text><text x="409" y="223.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">OCR / 页面适配 / Harness</text><text x="409" y="241.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">任务、记忆、附件与实际回执</text><polyline points="409,262 409,312" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#loop-gray)"  /><text x="70" y="365" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">03</text><rect x="100" y="312" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="342.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">模型提出动作</text><text x="409" y="369.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">VisionClient → AgentAction</text><text x="409" y="387.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">动作是提议，由宿主决定是否派发</text><polyline points="409,408 409,458" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#loop-gray)"  /><rect x="361" y="413" width="96" height="23" fill="#ffffff"/><text x="409" y="427" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">结构化动作</text><text x="70" y="511" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">04</text><rect x="100" y="458" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="488.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">宿主执行前复核</text><text x="409" y="515.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">流 / 尺寸 / 变化 / 取消 / 授权</text><text x="409" y="533.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">画面失效则丢弃动作、重新观察</text><polyline points="409,554 409,604" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#loop-gray)"  /><rect x="361" y="559" width="96" height="23" fill="#ffffff"/><text x="409" y="573" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">校验通过</text><text x="70" y="657" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">05</text><rect x="100" y="604" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="634.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">受控执行</text><text x="409" y="661.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">MouseExecutor / phone_tool / system_tool</text><text x="409" y="679.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">单一输入所有者与稳定操作身份</text><polyline points="409,700 409,750" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#loop-gray)"  /><text x="70" y="803" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">06</text><rect x="100" y="750" width="618" height="96" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="409" y="780.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">结果取证与持久化</text><text x="409" y="807.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">新画面 + 工具回执 + 完成策略</text><text x="409" y="825.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">先保存记录，再发布终态</text><polyline points="409,846 409,868 16,868 16,8 409,8 409,20" fill="none" stroke="#286ca8" stroke-width="1.4" marker-end="url(#loop-blue)"  stroke-dasharray="5 4"/><text x="36" y="423" text-anchor="start" font-size="12" font-weight="400" fill="#286ca8">未完成</text><text x="36" y="443" text-anchor="start" font-size="12" font-weight="400" fill="#286ca8">再观察</text><text x="100" y="888" text-anchor="start" font-size="12" font-weight="400" fill="#657281">完成 / 需要人工处理 / 失败 / 停止 → 退出本轮</text></svg>