<svg xmlns="http://www.w3.org/2000/svg" width="736" height="926" viewBox="0 0 736 926" role="img" aria-label="数据与恢复：四类本机数据域，以及未知提交结果的保守核验路径" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title>数据与恢复：四类本机数据域，以及未知提交结果的保守核验路径</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="data-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#657281"/></marker><marker id="data-gray-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M7 1 L1 4 L7 7Z" fill="#657281"/></marker><marker id="data-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7Z" fill="#286ca8"/></marker><marker id="data-blue-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M7 1 L1 4 L7 7Z" fill="#286ca8"/></marker></defs><rect x="16" y="20" width="341" height="140" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="186.5" y="72.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">会话与任务</text><text x="186.5" y="99.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">对话消息 · 任务历史 · 屏幕队列</text><text x="186.5" y="117.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">任务 ID · 补充要求 · 检查点</text><rect x="379" y="20" width="341" height="140" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="549.5" y="72.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">长期记忆</text><text x="549.5" y="99.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">手动索引 · 五个基础文档</text><text x="549.5" y="117.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">事实来源 · 自动学习 · 接收方边界</text><rect x="16" y="186" width="341" height="140" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="186.5" y="238.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">证据与产物</text><text x="186.5" y="265.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">聊天 / 笔记可见证据 · 文件原件</text><text x="186.5" y="283.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">工具回执 · 工作流日志 · 导出产物</text><rect x="379" y="186" width="341" height="140" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="549.5" y="238.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">配置与凭据</text><text x="549.5" y="265.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">UserDefaults：配置和偏好</text><text x="549.5" y="283.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">Keychain：模型及业务连接凭据</text><text x="16" y="388" text-anchor="start" font-size="14" font-weight="500" fill="#17212b">恢复与未知提交结果</text><rect x="100" y="416" width="536" height="78" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="368" y="446.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">保存原任务与提交意图</text><text x="368" y="473.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">稳定 taskID / operation_id；提交前先落盘</text><polyline points="368,494 368,548" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#data-gray)"  /><rect x="100" y="548" width="536" height="78" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="368" y="578.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">执行并核对实际结果</text><text x="368" y="605.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">新观察 / 真实回执；模型声明不是完成证据</text><polyline points="368,626 368,656 228,656 228,690" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#data-gray)"  /><polyline points="368,656 508,656 508,690" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#data-gray)"  /><rect x="100" y="690" width="256" height="82" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="228" y="722.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">结果已确认</text><text x="228" y="749.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">保存回执并发布终态</text><rect x="380" y="690" width="256" height="82" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="508" y="722.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">结果未知</text><text x="508" y="749.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">保留原操作，进入人工核验</text><polyline points="508,772 508,820" fill="none" stroke="#657281" stroke-width="1.4" marker-end="url(#data-gray)"  /><rect x="380" y="820" width="256" height="82" rx="6" fill="#f4f6f8" stroke="#c7ced6" stroke-width="1.2" /><text x="508" y="852.5" text-anchor="middle" font-size="14" font-weight="500" fill="#17212b">明确恢复或结束</text><text x="508" y="879.5" text-anchor="middle" font-size="12" font-weight="400" fill="#657281">核验后决定；不自动重发</text></svg>